<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="crab.css">
</head>
<body>
    <img src="/image/membership.png" alt="" width="110px" height="110px">
    <br>
    
    <div class="portal-title">
        <span class="membership">MEMBERSHIP</span><br>
        <span class="fee">FEE PORTAL</span>
    </div>

    <form action="erp.php" method="POST">

    <link rel="icon" href="image/lock.png">

    <img src="image/lock.png" class="lock-icon" width="100" height="100">

    <h1>Login</h1>

    <h4>Student Number</h4>

<div class="input-box">
    <img src="image/hat.png" class="student-icon">

    <input 
        type="number"
        name="student_number"
        placeholder="Enter your student number"
        class="no-spinner"
        required
    >
</div>

<div class="input-box">
    <img src="image/pad.png" class="password-icon">

    <input 
        type="password"
        name="password"
        placeholder="Enter your password"
        required
    >
</div>

    <br><br>

    <input 
        type="checkbox"
        name="remember"
        value="yes"
    >

    <label>Remember me</label>

    <br><br>

    <button type="submit">Login</button>

</form>


</body>
</html>
